name: 转换或排版问题
description: 提交可复现的最小样例，帮助定位问题。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        请先删去姓名、客户资料、密钥和内部地址。只提交可公开的合成最小样例；不要直接上传工作文档或完整日志。
  - type: input
    id: version
    attributes:
      label: 工具版本或候选包名称
      description: 安装版从“关于与帮助”查看版本；开发构建可填写提交号或BUILD.json中的buildId。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 使用环境
      description: Windows版本、安装版或便携版、所选模板；安装问题请保留提示原文，排版问题请补充Word或WPS的完整版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从添加文件开始，说明操作、设置和出现问题的位置。
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: 最小Markdown样例
      description: 尽量缩减到仍能复现问题的几行；有图片时附上可公开的测试图片。
      render: markdown
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 错误提示或脱敏截图；说明哪一行、哪一个表格出现问题。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
